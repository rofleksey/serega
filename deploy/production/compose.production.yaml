services:
  app:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SEREGA_HTTP_ADDR: :8080
      SEREGA_COOKIE_SECURE: "true"
      SEREGA_LOG_FORMAT: json
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
