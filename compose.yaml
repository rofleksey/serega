services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: serega
      POSTGRES_USER: serega
      POSTGRES_PASSWORD: serega
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serega -d serega"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
