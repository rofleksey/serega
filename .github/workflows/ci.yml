name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Generate production sources and assets
        run: make generate

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Lint integration tests
        run: golangci-lint run --build-tags=integration ./test/integration/...

      - name: Run static checks
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./cmd/... ./internal/...
          go list ./cmd/... ./internal/... | grep -v '/internal/api/generated$' | xargs go tool staticcheck
          npm --prefix web run check

      - name: Run unit tests
        run: |
          go test ./cmd/... ./internal/...
          npm --prefix web test

      - name: Run race checks
        run: go test -race ./internal/middleware ./internal/app ./internal/usecase/...

      - name: Build and run integration tests
        run: make test-integration
